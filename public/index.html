<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EasyTube Downloader</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="app">
    <section class="card">
      <header class="header">
        <div class="brand">
          <div class="logo">⬇</div>

          <div>
            <h1>EasyTube Downloader</h1>
            <p>Baixe vídeos do YouTube em MP4 de forma simples.</p>
          </div>
        </div>

        <button id="settingsBtn" class="settings-button" type="button" title="Configurações">
        ⚙
        </button>
      </header>

      <section class="input-area">
        <label for="videoUrl">Link do vídeo</label>

        <div class="input-group">
          <input id="videoUrl" type="text" placeholder="Cole aqui o link do YouTube" autocomplete="off" />
          <button id="pasteBtn" class="secondary-button" type="button">Colar</button>
          <button id="clearBtn" class="ghost-button" type="button">Limpar</button>
        </div>
      </section>

        <div id="loadingMetadata" class="loading hidden">
          <div class="spinner"></div>
          <span>Obtendo informações do vídeo...</span>
        </div>

      <section id="videoPreview" class="video-preview hidden">
        <div class="thumbnail-box">
          <img id="videoThumbnail" src="" alt="Miniatura do vídeo" />
        </div>

        <div class="video-info">
          <span class="badge">VÍDEO</span>
          <h2 id="videoTitle"></h2>
          <p id="videoChannel"></p>
          <p id="videoDuration"></p>
        </div>
      </section>

      <button id="downloadBtn" disabled>Baixar vídeo</button>
      <button
          id="cancelBtn"
          class="danger-button hidden"
          type="button">
          ⛔ Cancelar download
      </button>

      <section id="progressArea" class="progress-section hidden">
        <div class="progress-info">
          <span id="status">Preparando download...</span>
          <strong id="percent">0%</strong>
        </div>

        <div class="progress-bar">
          <div id="progressFill"></div>
        </div>

        <div id="progressDetails"></div>
      </section>

      <section id="result" class="hidden"></section>
    </section>

    <div id="settingsOverlay" class="settings-overlay hidden"></div>

<aside id="settingsPanel" class="settings-panel">
  <div class="settings-header">
    <h2>Configurações</h2>
    <button id="closeSettingsBtn" class="close-settings" type="button">×</button>
  </div>

  <div class="settings-content">
    <div class="settings-group">
      <label>Pasta de download</label>
      <input
            id="downloadFolder"
            type="text"
            disabled
      />
      <button class="secondary-button" type="button">Escolher pasta</button>
    </div>

    <div class="settings-group">
      <label>Qualidade</label>
      <select id="videoQuality">
        <option value="best">Melhor disponível</option>
        <option value="1080">1080p</option>
        <option value="720">720p</option>
        <option value="480">480p</option>
      </select>
    </div>

    <div class="settings-group">
      <label>Formato</label>
      <select id="videoFormat">
        <option value="mp4">MP4</option>
        <option value="mp3">MP3</option>
      </select>
    </div>

    <div class="settings-group">
        <label>Navegador para cookies</label>

        <select id="cookiesBrowser">
            <option value="none">Nenhum</option>
            <option value="edge">Microsoft Edge</option>
            <option value="chrome">Google Chrome</option>
            <option value="firefox">Mozilla Firefox</option>
            <option value="brave">Brave</option>
            <option value="opera">Opera</option>
        </select>
    </div>  
  </div>


    <label class="checkbox-option">
        <input
            id="openFolderAfterDownload"
            type="checkbox"
        />

        Abrir pasta automaticamente ao concluir
      </label>

    <button
        id="saveSettingsBtn"
        class="save-settings"
        type="button">
        Salvar configurações
    </button>
  </div>
</aside>

  </main>

  <script src="js/shared/dom.js"></script>
  <script src="js/shared/state.js"></script>
  <script src="js/shared/events.js"></script>
  <script src="js/shared/actions.js"></script>
  <script src="js/utils/utils.js"></script>
  <script src="js/services/websocket.js"></script>
  <script src="js/ui/ui.js"></script>
  <script src="js/modules/metadata.js"></script>
  <script src="js/modules/download.js"></script>
  <script src="js/modules/settings.js"></script>
  <script src="js/app.js"></script>
  
</body>
</html>
