<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Baixar vídeo do YouTube</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="container">
    <h1>Baixar vídeo do YouTube</h1>

    <p>Cole o link do vídeo abaixo:</p>

    <input 
      id="videoUrl" 
      type="text" 
      placeholder="https://www.youtube.com/watch?v=..." 
    />

    <button id="downloadBtn">Baixar vídeo</button>

    <div id="progressArea" class="hidden">
      <div class="progress-info">
        <span id="status">Preparando download...</span>
        <span id="percent">0%</span>
      </div>

      <div class="progress-bar">
        <div id="progressFill"></div>
      </div>
    </div>

    <div id="result" class="hidden"></div>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
