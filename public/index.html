<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>EasyTube Downloader</title>

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="app">
    <section class="card">
      <header class="header">
        <div class="logo">▶</div>

        <div>
          <h1>EasyTube Downloader</h1>
          <p>Baixe vídeos do YouTube em MP4 de forma simples.</p>
        </div>
      </header>

      <section class="input-area">
        <label for="videoUrl">Link do vídeo</label>

        <input
          id="videoUrl"
          type="text"
          placeholder="Cole aqui o link do YouTube"
          autocomplete="off"
        />

        <button id="downloadBtn">Baixar vídeo</button>
      </section>

      <section id="progressArea" class="progress-section hidden">
        <div class="progress-info">
          <span id="status">Preparando download...</span>
          <strong id="percent">0%</strong>
        </div>

        <div class="progress-bar">
          <div id="progressFill"></div>
        </div>

        <div id="progressDetails"></div>
      </section>

      <section id="result" class="hidden"></section>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
